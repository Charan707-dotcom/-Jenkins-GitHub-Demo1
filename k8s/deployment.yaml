
apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: banking-system
  template:
    metadata:
      labels:
        app: banking-system
    spec:
      containers:
        - name: banking-system
          image: banking-system:lab5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://host.docker.internal:3306/bankingsystem?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata"
