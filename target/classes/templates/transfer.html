<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Transfer Money - SimpleBank</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

    <!-- Navigation -->

    <nav class="top">

        <b>SimpleBank</b>

        <span>

            <a href="/user/dashboard">
                Dashboard
            </a>

            <a href="/transactions">
                Transactions
            </a>

            <a href="/loans/apply">
                Apply Loan
            </a>

            <a href="/logout">
                Logout
            </a>

        </span>

    </nav>


    <!-- Main -->

    <main class="page">

        <div class="card">

            <h1>
                Transfer Money
            </h1>

            <p>
                Transfer money to another bank account.
            </p>


            <!-- Error -->

            <div
                class="error"
                th:if="${error}"
                th:text="${error}">
            </div>


            <!-- Current Account -->

            <div th:if="${account != null}">

                <p>
                    <b>Your Account Number:</b>
                </p>

                <p>

                    <strong
                        th:text="${account.accountNumber}">
                        Account Number
                    </strong>

                </p>


                <p>

                    <b>Available Balance:</b>

                    ₹

                    <span
                        th:text="${account.balance}">
                        0.00
                    </span>

                </p>


                <hr>


                <!-- Transfer Form -->

                <form
                    method="post"
                    action="/user/transfer">


                    <!-- Receiver Account -->

                    <label for="receiverAccountNumber">

                        Receiver Account Number

                    </label>

                    <input
                        id="receiverAccountNumber"
                        name="receiverAccountNumber"
                        type="text"
                        placeholder="Enter receiver account number"
                        required>


                    <!-- Amount -->

                    <label for="amount">

                        Transfer Amount

                    </label>

                    <input
                        id="amount"
                        name="amount"
                        type="number"
                        min="0.01"
                        step="0.01"
                        placeholder="Enter amount"
                        required>


                    <!-- Submit -->

                    <button type="submit">

                        Transfer Money

                    </button>

                </form>


            </div>


            <!-- No Account -->

            <div th:if="${account == null}">

                <h2>
                    No Bank Account
                </h2>

                <p>
                    Create a bank account before transferring money.
                </p>

                <a
                    class="btn"
                    href="/account/create">

                    Create Bank Account

                </a>

            </div>


            <br>


            <a href="/user/dashboard">

                Back to Dashboard

            </a>

        </div>

    </main>

</body>

</html>
